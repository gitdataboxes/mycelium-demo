name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build:demo
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mycelium
          POSTGRES_PASSWORD: mycelium_demo
          POSTGRES_DB: mycelium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mycelium"
          --health-interval 3s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://mycelium:mycelium_demo@localhost:5432/mycelium_test
      DATABASE_URL: postgresql+asyncpg://mycelium:mycelium_demo@localhost:5432/mycelium_seed
      PGPASSWORD: mycelium_demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e './backend[dev]'
      - name: Provision isolated databases
        run: |
          psql -h localhost -U mycelium -d mycelium_test -c 'CREATE EXTENSION IF NOT EXISTS vector'
          psql -h localhost -U mycelium -d mycelium_test -c 'CREATE DATABASE mycelium_seed'
      - run: python -m pytest tests -q
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - name: Seed fresh database and check repeat guard
        run: |
          python seed_synthetic.py
          python seed_synthetic.py
      - run: python -m compileall -q backend/app seed_synthetic.py
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start local stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - run: docker compose exec -T backend python seed_synthetic.py
      - name: Exercise local email login and seeded discovery
        run: python3 scripts/smoke_stack.py
      - name: Check frontend and API
        run: |
          curl --fail http://localhost:3000
          curl --fail http://localhost:8000/api/health
          curl --fail http://localhost:8025/api/v1/info
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=80
      - name: Stop stack
        if: always()
        run: docker compose down
